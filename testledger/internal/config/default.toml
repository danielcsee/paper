schema_version = 1
database = ".testledger/testledger.db"
artifact_directory = ".testledger/artifacts"

# Let agents record human decisions (`decide`, `skip`) over MCP. Off by design:
# the workflow rests on agents proposing and humans deciding, and a decision
# tool the agent can call is a gate on the honour system. While this is false
# those two tools are not advertised over MCP at all, and the human runs them
# from the command line.
allow_agent_decisions = false

[[languages]]
name = "python"
python = "python3"
include = ["**/*.py"]
exclude = [".git/**", ".testledger/**", ".venv/**", "venv/**", ".tox/**", "build/**", "dist/**", "tests/**", "test_*.py", "**/test_*.py", "**/__pycache__/**", "**/migrations/**"]

[languages.test]
runner = "pytest"
command = ["python3", "-m", "pytest"]
test_roots = ["tests"]

[languages.coverage]
source = ["."]
branch = true
minimum_line_percent = 80.0

[execution]
timeout_seconds = 600
max_output_bytes = 1048576
max_parallel_runs = 1
environment_allowlist = ["PATH", "VIRTUAL_ENV", "PYTHONPATH"]
