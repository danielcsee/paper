# Datastores only. The API and UI run on the host in dev (scripts/dev.sh);
# the `api` service below is for running the built image instead.
services:
  postgres:
    # pgvector image so the extension is available when we add embeddings.
    image: pgvector/pgvector:pg17
    container_name: sciterm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sciterm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sciterm}
      POSTGRES_DB: ${POSTGRES_DB:-sciterm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sciterm} -d ${POSTGRES_DB:-sciterm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    container_name: sciterm-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/sciterm_dev_pw}
      # GDS supplies PageRank / personalized PageRank for the ranking layer.
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: sciterm-redis
    # Celery's broker and result backend. Queue state is reconstructible from
    # paper_stage_runs, so persistence is deliberately off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    container_name: sciterm-redis-cache
    # A SEPARATE instance from the broker above, on purpose. maxmemory and the
    # eviction policy are per-instance, not per-database, so a cache sharing the
    # broker's Redis could evict queued Celery tasks -- silently, since Celery's
    # queue lists carry no TTL and nothing reports an eviction. Isolated here,
    # `allkeys-lru` can only ever discard cached documents, and every miss just
    # re-fetches from PubTator.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Not started by dev.sh. Use `docker compose --profile app up --build api`
  # to run the packaged image (FastAPI serving the compiled UI bundle).
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sciterm-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sciterm}:${POSTGRES_PASSWORD:-sciterm}@postgres:5432/${POSTGRES_DB:-sciterm}
      NEO4J_URI: bolt://neo4j:7687
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
